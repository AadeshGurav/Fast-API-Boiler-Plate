{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <div class="row mb-4">
        <div class="col-12">
            <div class="card demo-card">
                <div class="card-body">
                    <h4 class="card-title">
                        <i class="fas fa-cog me-2"></i>
                        System Settings
                    </h4>
                    <p class="text-muted">Configure system-wide settings and preferences.</p>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card demo-card">
                <div class="card-body">
                    <h5 class="card-title">Application Settings</h5>
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Application Name</label>
                            <input type="text" class="form-control" value="{{ settings.app_name }}" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Version</label>
                            <input type="text" class="form-control" value="{{ settings.version }}" readonly>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" {{ 'checked' if settings.debug else '' }} disabled>
                                <label class="form-check-label">Debug Mode</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Max Users</label>
                            <input type="number" class="form-control" value="{{ settings.max_users }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Session Timeout (seconds)</label>
                            <input type="number" class="form-control" value="{{ settings.session_timeout }}">
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" {{ 'checked' if settings.enable_registration else '' }}>
                                <label class="form-check-label">Enable Registration</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" {{ 'checked' if settings.require_email_verification else '' }}>
                                <label class="form-check-label">Require Email Verification</label>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-2"></i>Save Settings
                        </button>
                    </form>
                </div>
            </div>
        </div>
        
        <div class="col-md-6">
            <div class="card demo-card">
                <div class="card-body">
                    <h5 class="card-title">System Actions</h5>
                    <div class="d-grid gap-2">
                        <button class="btn btn-outline-primary">
                            <i class="fas fa-sync me-2"></i>Refresh RBAC Cache
                        </button>
                        <button class="btn btn-outline-warning">
                            <i class="fas fa-database me-2"></i>Backup Database
                        </button>
                        <button class="btn btn-outline-info">
                            <i class="fas fa-chart-line me-2"></i>View Logs
                        </button>
                        <button class="btn btn-outline-success">
                            <i class="fas fa-check-circle me-2"></i>Run Health Check
                        </button>
                        <button class="btn btn-outline-danger">
                            <i class="fas fa-exclamation-triangle me-2"></i>Clear Cache
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
