# Optional: `pip install pre-commit && pre-commit install` runs these before every commit.
exclude: ^graphify-out/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0  # keep in step with ruff in requirements-dev.txt
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
