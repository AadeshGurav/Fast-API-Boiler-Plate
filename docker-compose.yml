# Local development services. The app itself runs from the host (`make run`) or, for a
# production-like check, from the image built by the Dockerfile (`make docker-run`).
#
# Credentials come from .env (created by `make setup`); nothing secret is committed.
name: fastapi_boilerplate

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"   # loopback only: never expose a database to the LAN
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?run `make setup` to create .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?run `make setup` to create .env}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run `make setup` to create .env}"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  postgres:
    profiles: ["postgres"]     # only with `make up-postgres` (app_database_provider = "postgres")
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: fabp
      POSTGRES_DB: fabp
      # make setup writes a random one; the fallback only keeps `docker compose` working
      # for an .env created before PostgreSQL support (the port is loopback-only).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-run-make-setup}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["app"]          # only with `docker compose --profile app up` / `make docker-up`
    build: .
    depends_on:
      mongodb: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-8000}:8000"
    environment:
      FABP_MONGO_USERNAME: ${MONGO_ROOT_USERNAME}
      FABP_MONGO_PASSWORD: ${MONGO_ROOT_PASSWORD}
      FABP_REDIS_PASSWORD: ${REDIS_PASSWORD}
      FABP_JWT_SECRET: ${FABP_JWT_SECRET:?run `make setup` to create .env}
      # A fallback, not ":?": Compose checks required variables for every service, so a
      # missing key would break `make up` for the databases too. The app refuses the
      # placeholder at start-up with a message saying what to do.
      FABP_MFA_ENCRYPTION_KEY: ${FABP_MFA_ENCRYPTION_KEY:-change-me-run-make-setup}
    volumes:
      - uploads:/app/uploads

volumes:
  postgres_data:
  uploads:
  mongodb_data:
  redis_data:
