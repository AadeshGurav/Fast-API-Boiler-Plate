version: "3.8"

services:
  mongodb:
    # Switched to official image which supports Apple Silicon native
    image: mongo:8.0
    container_name: mongodb
    hostname: mongodb
    restart: always
    ports:
      - "27017:27017"  # Kept original port so your App doesn't break
    volumes:
      - mongodb_data:/data/db
    environment:
      # Kept your original password 'ag'
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ag
      # Note: Official image does not auto-configure Replica Sets like Bitnami.
      # If your app fails on "Transactions", we need a different fix.
    
    # Official images use a different healthcheck format
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
      
    deploy:
      resources:
        limits:
          memory: 2048M

  # Added Redis back (You need this!)
  redis:
    image: redis:7.2-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ag-network

volumes:
  mongodb_data:
  redis_data:

networks:
  ag-network:
    driver: bridge
