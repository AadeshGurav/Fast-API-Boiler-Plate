name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore: ["graphify-out/**"]  # tracked for reference only: never builds or checks
  pull_request:
    paths-ignore: ["graphify-out/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported floor (.python-version) and the newest release we test against.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check app tests main.py config.py
          ruff format --check app tests main.py config.py

      # The suite uses in-memory stand-ins for MongoDB and Redis: no services needed.
      - name: Test
        run: python -m pytest -q --cov=app --cov-report=term-missing:skip-covered

  contract:
    # The storage-agnostic promise, proven against the real engines.
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: fabp, POSTGRES_PASSWORD: contract, POSTGRES_DB: fabp}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fabp" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Contract tests
        env:
          CONTRACT_DATABASES: fake,mongodb,postgres
          CONTRACT_CACHES: memory,redis
          FABP_POSTGRES_PASSWORD: contract
        run: python -m pytest tests/contract -q

  audit:
    # Known vulnerabilities in pinned runtime dependencies fail the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Audit dependencies
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt -r requirements-s3.txt -r requirements-postgres.txt -r requirements-observability.txt

  image:
    # The shipped image must build and carry no HIGH or CRITICAL fixable vulnerability.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t fabp:ci .
      - name: Scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8  # v0.36.0
        with:
          image-ref: fabp:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
