name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore: ["graphify-out/**"]  # tracked for reference only: never builds or checks
  pull_request:
    paths-ignore: ["graphify-out/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported floor (.python-version) and the newest release we test against.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.18"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # Exactly what uv.lock says; fails if pyproject.toml changed without `make lock`.
      - name: Install
        run: uv sync --frozen --all-extras

      - name: Lock and exported requirements are current
        if: matrix.python-version == '3.11'
        run: |
          uv lock --check
          make export-requirements
          git diff --exit-code -- 'requirements*.txt'

      - name: Lint
        run: |
          uv run ruff check app tests main.py config.py
          uv run ruff format --check app tests main.py config.py

      # The suite uses in-memory stand-ins for MongoDB and Redis: no services needed.
      - name: Test
        run: uv run pytest -q --cov=app --cov-report=term-missing:skip-covered

      # Generated requests for every operation: no 5xx, and only documented answers.
      - name: Fuzz the API contract
        run: uv run pytest -q -m fuzz

  contract:
    # The storage-agnostic promise, proven against the real engines.
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: fabp, POSTGRES_PASSWORD: contract, POSTGRES_DB: fabp}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fabp" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.18"
          python-version-file: .python-version
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: Contract tests
        env:
          CONTRACT_DATABASES: fake,mongodb,postgres
          CONTRACT_CACHES: memory,redis
          FABP_POSTGRES_PASSWORD: contract
        run: uv run pytest tests/contract -q

  audit:
    # Known vulnerabilities anywhere in the locked dependency tree fail the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.18"
          python-version-file: .python-version
      - name: Audit dependencies
        run: uvx pip-audit==2.10.1 --disable-pip --require-hashes -r requirements-dev.txt

  image:
    # The shipped image must build and carry no HIGH or CRITICAL fixable vulnerability.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t fabp:ci .
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: fabp:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
