# Weekly dependency update pull requests; review the changelog before merging.
version: 2
updates:
  - package-ecosystem: uv   # pyproject.toml + uv.lock; run `make export-requirements` on its PRs
    directory: /
    schedule: {interval: weekly}
    target-branch: develop
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    target-branch: develop
