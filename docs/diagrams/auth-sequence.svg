troke-width="1.2" marker-end="url(#auth-sequence-arrow)"/><rect x="430" y="382" width="100" height="12" rx="2" fill="#f5f5f5"/><text x="480" y="391" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REFRESH_TOKENS()</text><path d="M 600,432 H 838" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#auth-sequence-arrow)"/><rect x="684" y="414" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="720" y="423" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ROTATE HASH</text><path d="M 360,464 H 122" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#auth-sequence-arrow)"/><rect x="188" y="446" width="104" height="12" rx="2" fill="#f5f5f5"/><text x="240" y="455" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">200 · NEW COOKIES</text><path d="M 600,536 H 838" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#auth-sequence-arrow)"/><rect x="676" y="518" width="88" height="12" rx="2" fill="#f5f5f5"/><text x="720" y="527" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REVOKE SESSION</text><path d="M 360,568 H 122" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#auth-sequence-arrow)"/><rect x="198" y="550" width="84" height="12" rx="2" fill="#f5f5f5"/><text x="240" y="559" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">401 · PROBLEM</text><rect x="48" y="24" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="48" y="24" width="144" height="48" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#5a6580" stroke-width="1"/><rect x="56" y="30" width="24" height="12" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.40" stroke-width="0.8"/><text x="68" y="39" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APP</text><text x="120" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Client</text><text x="120" y="66" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">browser · app</text><rect x="288" y="24" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="288" y="24" width="144" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="296" y="30" width="24" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="308" y="39" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text><text x="360" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">API</text><text x="360" y="66" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">middleware + routes</text><rect x="528" y="24" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="528" y="24" width="144" height="48" rx="6" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/><rect x="536" y="30" width="24" height="12" rx="2" fill="none" stroke="#bf4520" stroke-opacity="0.50" stroke-width="0.8"/><text x="548" y="39" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text><text x="600" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">AuthService</text><text x="600" y="66" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">tokens · sessions</text><rect x="768" y="24" width="144" height="48" rx="6" fill="#f5f5f5"/><rect x="768" y="24" width="144" height="48" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/><rect x="776" y="30" width="20" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/><text x="786" y="39" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text><text x="840" y="52" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Session store</text><text x="840" y="66" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">MongoDB + cache</text><line x1="32" y1="640" x2="928" y2="640" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/><text x="32" y="658" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><line x1="112" y1="655" x2="140" y2="655" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#auth-sequence-arrow-link)"/><text x="148" y="658" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">HTTP call</text><line x1="228" y1="655" x2="256" y2="655" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#auth-sequence-arrow)"/><text x="264" y="658" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">internal call</text><line x1="368" y1="655" x2="396" y2="655" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#auth-sequence-arrow)"/><text x="404" y="658" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">return</text><line x1="468" y1="655" x2="496" y2="655" stroke="#bf4520" stroke-width="1.4" marker-end="url(#auth-sequence-arrow-accent)"/><text x="504" y="658" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">headline succes