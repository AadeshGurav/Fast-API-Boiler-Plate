<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 704" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="auth-sequence-title auth-sequence-desc" id="auth-sequence-root"><title id="auth-sequence-title">Sign in once, refresh silently, catch a stolen token</title><desc id="auth-sequence-desc">Authentication sequence: login creates a server-side session and a token pair bound to it; when the access token expires the refresh cookie is rotated transparently, and replaying an already-rotated refresh token revokes the whole session and answers 401.</desc><defs>
      <style>#auth-sequence-root { font-family: 'Geist', system-ui, sans-serif; color: #2d3142; }
      #auth-sequence-root .diagram-container { width: 100%; overflow-x: auto; }
      #auth-sequence-root .diagram-container { overflow-x: visible; }</style>
<marker id="auth-sequence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="auth-sequence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="auth-sequence-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
<marker id="auth-sequence-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
</defs><rect width="100%" height="100%" fill="#f5f5f5"/><line x1="120" y1="72" x2="120" y2="616" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/><line x1="360" y1="72" x2="360" y2="616" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/><line x1="600" y1="72" x2="600" y2="616" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/><line x1="840" y1="72" x2="840" y2="616" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="3,3"/><rect x="96" y="344" width="768" height="248" rx="4" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1"/><rect x="96" y="344" width="40" height="16" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-opacity="0.22" stroke-width="1"/><text x="116" y="356" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text><text x="132" y="376" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[refresh token is the current one]</text><line x1="104" y1="496" x2="856" y2="496" stroke="#2d3142" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="4,3"/><text x="132" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">[else · an already-rotated token was replayed]</text><path d="M 120,112 H 358" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#auth-sequence-arrow-link)"/><rect x="190" y="94" width="100" height="12" rx="2" fill="#f5f5f5"/><text x="240" y="103" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">POST /AUTH/LOGIN</text><path d="M 360,144 H 598" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#auth-sequence-arrow)"/><rect x="442" y="126" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="480" y="135" fi