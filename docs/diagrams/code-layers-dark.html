<style>

<div class="frame">
<p class="eyebrow">Layer stack · for developers</p>
<h1>Five layers, each calling only the one below</h1>

<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#bfc0c0" stroke-width="1.2"/></marker>
</defs><rect width="100%" height="100%" fill="#2d3142"/><rect x="144" y="56" width="728" height="64" fill="#393e53"/><text x="164" y="92" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">L5</text><text x="232" y="86" fill="#f5f5f5" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Routes</text><text x="232" y="102" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">app/api/routes/ · parse, call a service, shape the reply</text><text x="852" y="92" fill="#949eb2" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">no business logic</text><rect x="144" y="120" width="728" height="64" fill="#2d3142"/><line x1="144" y1="120" x2="872" y2="120" stroke="rgba(245,245,245,0.12)" stroke-width="1"/><text x="164" y="156" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">L4</text><text x="232" y="150" fill="#f5f5f5" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Services</text><text x="232" y="166" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">auth · mfa · rbac · audit · jobs · files</text><text x="852" y="156" fill="#949eb2" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">never touch a driver</text><rect x="144" y="184" width="728" height="64" fill="rgba(240,138,89,0.08)"/><line x1="144" y1="184" x2="872" y2="184" stroke="rgba(245,245,245,0.12)" stroke-width="1"/><text x="164" y="220" fill="#f08a59" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">L3</text><text x="232" y="214" fill="#f5f5f5" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Data layer</text><text x="232" y="230" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">DataService + services/data/*_ops.py · cache keys</text><text x="852" y="220" fill="#949eb2" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">where queries live</text><rect x="144" y="248" width="728" height="64" fill="#2d3142"/><line x1="144" y1="248" x2="872" y2="248" stroke="rgba(245,245,245,0.12)" stroke-width="1"/><text x="164" y="284" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">L2</text><text x="232" y="278" fill="#f5f5f5" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Backend services</text><text x="232" y="294" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">DatabaseService · CacheService · create_storage</text><text x="852" y="284" fill="#949eb2" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">pick, namespace, degrade</text><rect x="144" y="312" width="728" height="64" fill="#393e53"/><line x1="144" y1="312" x2="872" y2="312" stroke="rgba(245,245,245,0.12)" stroke-width="1"/><text x="164" y="348" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">L1</text><text x="232" y="342" fill="#f5f5f5" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Engines</text><text x="232" y="358" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">MongoDB | PostgreSQL · Redis | memory · local | S3</text><text x="852" y="348" fill="#949eb2" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">package.module:Class</text><rect x="144" y="56" width="728" height="320" fill="none" stroke="#bfc0c0" stroke-width="1"/><rect x="144.5" y="184.5" width="727" height="63" fill="none" stroke="#f08a59" stroke-width="1.2"/><path d="M 96,64 V 368" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#arrow)"/><text x="84" y="68" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.14em">CALLS</text><text x="84" y="372" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.14em">ENGINE</text><text x="144" y="412" fill="#bfc0c0" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Middleware wraps the top layer; build_services() wires all five once per app.</text><line x1="32" y1="428" x2="928" y2="428" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/><text x="32" y="446" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><rect x="112" y="436" width="28" height="14" rx="3" fill="rgba(240,138,89,0.08)" stroke="#f08a59" stroke-width="1"/><text x="148" y="446" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">add your resource&#x27;s queries here</text></svg>
