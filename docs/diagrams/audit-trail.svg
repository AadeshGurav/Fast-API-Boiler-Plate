<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="audit-trail-title audit-trail-desc" id="audit-trail-root"><title id="audit-trail-title">Who changed what, and from where, without passing it around</title><desc id="audit-trail-desc">Audit trail: RBACMiddleware puts the caller&#x27;s IP address, user agent and user id in a request context; when a service completes a security change (roles, grants, account status, passwords, sessions, two-factor, API tokens) it calls AuditService.record, which adds the request id and writes an append-only event to audit_events; administrators search it at GET /admin/audit-events, and events expire after audit_retention_days.</desc><defs>
      <style>#audit-trail-root { font-family: 'Geist', system-ui, sans-serif; color: #2d3142; }
      #audit-trail-root .diagram-container { width: 100%; overflow-x: auto; }
      #audit-trail-root .diagram-container { overflow-x: visible; }</style>
<marker id="audit-trail-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="audit-trail-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="audit-trail-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
<marker id="audit-trail-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
</defs><rect width="100%" height="100%" fill="#f5f5f5"/><rect x="24" y="40" width="912" height="208" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/><rect x="36" y="34" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="72" y="43" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">ONE REQUEST</text><path d="M 168,140 H 238" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#audit-trail-arrow-link)"/><path d="M 416,140 H 486" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#audit-trail-arrow)"/><path d="M 664,140 H 734" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#audit-trail-arrow)"/><path d="M 828,176 V 318" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#audit-trail-arrow)"/><path d="M 384,356 H 454" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#audit-trail-arrow-link)"/><path d="M 664,356 H 734" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#audit-trail-arrow)"/><rect x="177" y="122" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="203" y="131" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REQUEST</text><rect x="429" y="122" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="451" y="131" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CHANGE</text><rect x="677" y="122" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="699" y="131" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RECORD</text><rect x="836" y="278" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="858" y="287" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">APPEND</text><rect x="397" y="338" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="419" y="347" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SEARCH</text><rect x="683" y="338" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="699" y="347" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">READ</text><rect x="40" y="112" width="128" height="56" rx="6" fill="#f5f5f5"/><rect x="40" y="112" width="128" height="56" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#5a6580" stroke-width="1"/><rect x="48" y="118" width="20" height="12" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.40" stroke-width="0.8"/><text x="58" y="127" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">IN</text><text x="104" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Caller</text><text x="104" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">app · token</text><rect x="240" y="104" width="176" height="72" rx="6" fill="#f5f5f5"/><rect x="240" y="104" width="176" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="248" y="110" width="24" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="260" y="119" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CTX</text><text x="328" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">RBACMiddleware</text><text x="328" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">actor · IP · agent</text><rect x="488" y="104" width="176" height="72" rx="6" fill="#f5f5f5"/><rect x="488" y="104" width="176" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="496" y="110" width="24" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="508" y="119" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text><text x="576" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">A service</text><text x="576" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">RBAC · auth · tokens</text><rect x="736" y="104" width="184" height="72" rx="6" fill="#f5f5f5"/><rect x="736" y="104" width="184" height="72" rx="6" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/><rect x="744" y="110" width="24" height="12" rx="2" fill="none" stroke="#bf4520" stroke-opacity="0.50" stroke-width="0.8"/><text x="756" y="119" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text><text x="828" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">AuditService</text><text x="828" y="158" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">+ request id</text><rect x="736" y="320" width="184" height="72" rx="6" fill="#f5f5f5"/><rect x="736" y="320" width="184" height="72" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/><rect x="744" y="326" width="20" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/><text x="754" y="335" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text><text x="828" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">audit_events</text><text x="828" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">append-only · TTL</text><rect x="456" y="320" width="208" height="72" rx="6" fill="#f5f5f5"/><rect x="456" y="320" width="208" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="464" y="326" width="24" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="476" y="335" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">API</text><text x="560" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">GET /admin/audit-events</text><text x="560" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">filters · paged</text><rect x="240" y="328" width="144" height="56" rx="6" fill="#f5f5f5"/><rect x="240" y="328" width="144" height="56" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#5a6580" stroke-width="1"/><rect x="248" y="334" width="20" height="12" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.40" stroke-width="0.8"/><text x="258" y="343" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">IN</text><text x="312" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Administrator</text><text x="312" y="374" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">needs *</text><text x="48" y="216" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">A failed audit write is logged and never fails the change; refused changes are not recorded.</text><line x1="32" y1="448" x2="928" y2="448" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/><text x="32" y="466" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><line x1="112" y1="463" x2="140" y2="463" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#audit-trail-arrow-link)"/><text x="148" y="466" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">HTTP</text><line x1="200" y1="463" x2="228" y2="463" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#audit-trail-arrow)"/><text x="236" y="466" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">in-process</text><rect x="320" y="456" width="28" height="14" rx="3" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/><text x="356" y="466" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the one writer</text><rect x="464" y="456" width="28" height="14" rx="3" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/><text x="500" y="466" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">collection</text></svg>
