<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="webhook-delivery-dark-title webhook-delivery-dark-desc" id="webhook-delivery-dark-root"><title id="webhook-delivery-dark-title">Webhooks are jobs: signed, retried, and never silently lost</title><desc id="webhook-delivery-dark-desc">Webhook delivery: audit events and explicit publish() calls reach WebhookService, which matches them against subscriptions and queues one webhook.deliver job per match; a worker re-checks the destination, signs the request (Standard Webhooks HMAC-SHA256 over id, timestamp and body) and POSTs it; a non-2xx answer is retried with backoff using the same message id, and a receiver that keeps failing leaves the job dead and visible to administrators.</desc><defs>
      <style>#webhook-delivery-dark-root { font-family: 'Geist', system-ui, sans-serif; color: #f5f5f5; }
      #webhook-delivery-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #webhook-delivery-dark-root .diagram-container { overflow-x: visible; }</style>
<marker id="webhook-delivery-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
<marker id="webhook-delivery-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
<marker id="webhook-delivery-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
<marker id="webhook-delivery-dark-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#bfc0c0" stroke-width="1.2"/></marker>
</defs><rect width="100%" height="100%" fill="#2d3142"/><rect x="24" y="40" width="432" height="208" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="0.8"/><rect x="36" y="34" width="68" height="12" rx="2" fill="#2d3142"/><text x="70" y="43" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">IN THE API</text><path d="M 192,108 H 238" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#webhook-delivery-dark-arrow)"/><path d="M 192,196 H 238" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#webhook-delivery-dark-arrow)"/><path d="M 432,152 H 542" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#webhook-delivery-dark-arrow)"/><path d="M 736,152 H 822" fill="none" stroke="#739fdf" stroke-width="1.2" marker-end="url(#webhook-delivery-dark-arrow-link)"/><path d="M 640,192 V 318" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#webhook-delivery-dark-arrow)"/><rect x="194" y="90" width="40" height="12" rx="2" fill="#2d3142"/><text x="214" y="99" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EVENT</text><rect x="462" y="134" width="52" height="12" rx="2" fill="#2d3142"/><text x="488" y="143" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ENQUEUE</text><rect x="743" y="134" width="72" height="12" rx="2" fill="#2d3142"/><text x="779" y="143" fill="#739fdf" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SIGNED POST</text><rect x="648" y="250" width="68" height="12" rx="2" fill="#2d3142"/><text x="682" y="259" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NON-2XX x5</text><rect x="48" y="80" width="144" height="56" rx="6" fill="#2d3142"/><rect x="48" y="80" width="144" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><rect x="56" y="86" width="24" height="12" rx="2" fill="none" stroke="#f5f5f5" stroke-opacity="0.40" stroke-width="0.8"/><text x="68" y="95" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SRC</text><text x="120" y="112" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Audit log</text><text x="120" y="126" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">every security event</text><rect x="48" y="168" width="144" height="56" rx="6" fill="#2d3142"/><rect x="48" y="168" width="144" height="56" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><rect x="56" y="174" width="24" height="12" rx="2" fill="none" stroke="#f5f5f5" stroke-opacity="0.40" stroke-width="0.8"/><text x="68" y="183" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SRC</text><text x="120" y="200" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Your service</text><text x="120" y="214" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">publish(event)</text><rect x="240" y="88" width="192" height="128" rx="6" fill="#2d3142"/><rect x="240" y="88" width="192" height="128" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><rect x="248" y="94" width="24" height="12" rx="2" fill="none" stroke="#f5f5f5" stroke-opacity="0.40" stroke-width="0.8"/><text x="260" y="103" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text><text x="336" y="156" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">WebhookService</text><text x="336" y="170" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">match user.* · rbac.* · *</text><rect x="544" y="112" width="192" height="80" rx="6" fill="#2d3142"/><rect x="544" y="112" width="192" height="80" rx="6" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1"/><rect x="552" y="118" width="24" height="12" rx="2" fill="none" stroke="#f08a59" stroke-opacity="0.50" stroke-width="0.8"/><text x="564" y="127" fill="#f08a59" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">JOB</text><text x="640" y="156" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">webhook.deliver job</text><text x="640" y="170" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">retry · backoff · same id</text><rect x="824" y="112" width="112" height="80" rx="6" fill="#2d3142"/><rect x="824" y="112" width="112" height="80" rx="6" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="1"/><rect x="832" y="118" width="24" height="12" rx="2" fill="none" stroke="#f5f5f5" stroke-opacity="0.22" stroke-width="0.8"/><text x="844" y="127" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text><text x="880" y="156" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Receiver</text><text x="880" y="170" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">verify · dedupe</text><rect x="544" y="320" width="192" height="72" rx="6" fill="#2d3142"/><rect x="544" y="320" width="192" height="72" rx="6" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/><rect x="552" y="326" width="24" height="12" rx="2" fill="none" stroke="#bfc0c0" stroke-opacity="0.50" stroke-width="0.8"/><text x="564" y="335" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DLQ</text><text x="640" y="360" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Dead job</text><text x="640" y="374" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">/admin/jobs?status=dead</text><text x="48" y="436" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">Destinations: https only, never private or loopback addresses (checked again before each delivery); no redirects.</text><line x1="32" y1="440" x2="928" y2="440" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="0.8"/><text x="32" y="458" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><line x1="112" y1="455" x2="140" y2="455" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#webhook-delivery-dark-arrow)"/><text x="148" y="458" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">in-process</text><line x1="232" y1="455" x2="260" y2="455" stroke="#739fdf" stroke-width="1.2" marker-end="url(#webhook-delivery-dark-arrow-link)"/><text x="268" y="458" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">HTTPS</text><rect x="324" y="448" width="28" height="14" rx="3" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1"/><text x="360" y="458" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">retried unit</text><rect x="456" y="448" width="28" height="14" rx="3" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/><text x="492" y="458" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">visible failure</text><rect x="604" y="448" width="28" height="14" rx="3" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="1"/><text x="640" y="458" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">your other system</text></svg>
