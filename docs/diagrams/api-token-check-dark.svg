<marker id="api-token-check-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
<marker id="api-token-check-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
<marker id="api-token-check-dark-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#bfc0c0" stroke-width="1.2"/></marker>
</defs><rect width="100%" height="100%" fill="#2d3142"/><path d="M 360,64 V 86" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#api-token-check-dark-arrow)"/><path d="M 360,160 V 198" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#api-token-check-dark-arrow)"/><path d="M 360,272 V 310" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#api-token-check-dark-arrow)"/><path d="M 360,384 V 422" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#api-token-check-dark-arrow)"/><path d="M 360,496 V 530" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#api-token-check-dark-arrow-accent)"/><path d="M 456,124 H 638" fill="none" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#api-token-check-dark-arrow)"/><path d="M 456,236 H 638" fill="none" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#api-token-check-dark-arrow)"/><path d="M 456,348 H 638" fill="none" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#api-token-check-dark-arrow)"/><path d="M 456,460 H 638" fill="none" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#api-token-check-dark-arrow)"/><rect x="368" y="174" width="28" height="12" rx="2" fill="#2d3142"/><text x="382" y="183" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="368" y="286" width="28" height="12" rx="2" fill="#2d3142"/><text x="382" y="295" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="368" y="398" width="28" height="12" rx="2" fill="#2d3142"/><text x="382" y="407" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="368" y="508" width="28" height="12" rx="2" fill="#2d3142"/><text x="382" y="517" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="536" y="106" width="24" height="12" rx="2" fill="#2d3142"/><text x="548" y="115" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="536" y="218" width="24" height="12" rx="2" fill="#2d3142"/><text x="548" y="227" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="536" y="330" width="24" height="12" rx="2" fill="#2d3142"/><text x="548" y="339" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="536" y="442" width="24" height="12" rx="2" fill="#2d3142"/><text x="548" y="451" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="240" y="24" width="240" height="40" rx="20" fill="#2d3142"/><rect x="240" y="24" width="240" height="40" rx="20" fill="#bfc0c0" fill-opacity="0.10" stroke="#949eb2" stroke-width="1"/><text x="360" y="42" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Bearer fabp_pat_…</text><text x="360" y="56" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">looked up by SHA-256 hash</text><polygon points="360,88 456,124 360,160 264,124" fill="#2d3142"/><polygon points="360,88 456,124 360,160 264,124" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="360" y="128" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Known, unexpired?</text><polygon points="360,200 456,236 360,272 264,236" fill="#2d3142"/><polygon points="360,200 456,236 360,272 264,236" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="360" y="240" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Owner active?</text><polygon points="360,312 456,348 360,384 264,348" fill="#2d3142"/><polygon points="360,312 456,348 360,384 264,348" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="360" y="352" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Scopes cover it?</text><polygon points="360,424 456,460 360,496 264,460" fill="#2d3142"/><polygon points="360,424 456,460 360,496 264,460" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="360" y="464" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Owner holds it?</text><rect x="260" y="532" width="200" height="48" rx="20" fill="#2d3142"/><rect x="260" y="532" width="200" height="48" rx="20" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1"/><text x="360" y="554" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Route runs</text><text x="360" y="568" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no session · no refresh</text><rect x="640" y="100" width="248" height="160" rx="20" fill="#2d3142"/><rect x="640" y="100" width="248" height="160" rx="20" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="1"/><text x="764" y="178" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">401 problem</text><text x="764" y="192" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">revoked · expired · suspended</text><rect x="640" y="324" width="248" height="160" rx="20" fill="#2d3142"/><rect x="640" y="324" width="248" height="160" rx="20" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="1"/><text x="764" y="402" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">403 problem</text><text x="764" y="416" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">scopes ∩ current permissions</text><text x="640" y="520" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">A token cannot create or revoke tokens;</text><text x="640" y="534" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">removing a role narrows every token at once.</text><line x1="32" y1="624" x2="928" y2="624" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="0.8"/><text x="32" y="642" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><line x1="112" y1="639" x2="140" y2="639" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#api-token-check-dark-arrow)"/><text x="148" y="642" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">check</text><line x1="204" y1="639" x2="232" y2="639" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#api-token-check-dark-arrow)"/><text x="240" y="642" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">refused</text><line x1="308" y1="639" x2="336" y2="639" stroke="#f08a59" stroke-width="1.4" marker-end="url(#api-token-check-dark-arrow-accent)"/><text x="344" y="642" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">allowed</text><rect x="412" y="632" width="28" height="14" rx="3" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1"/><text x="448" y="642" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">success</text><rect x="516" y="632" width="28" height="14" rx="3" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="1"/><text x="552" y="642" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">early answer</text></svg>
