<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="api-token-check-dark-title api-token-check-dark-desc" id="api-token-check-dark-root"><title id="api-token-check-dark-title">An API token can never do more than its owner can right now</title><desc id="api-token-check-dark-desc">API token check: a fabp_pat_ bearer token is looked up by its SHA-256 hash; an unknown or expired token, or one whose owner is no longer active, answers 401; the permission the route needs must be covered by the token&#x27;s scopes and also held by the owner today, otherwise 403; only then does the route run.</desc><defs>
      <style>#api-token-check-dark-root { font-family: 'Geist', system-ui, sans-serif; color: #f5f5f5; }
      #api-token-check-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #api-token-check-dark-root .diagram-container { overflow-x: visible; }</style>
