<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="job-lifecycle-dark-title job-lifecycle-dark-desc" id="job-lifecycle-dark-root"><title id="job-lifecycle-dark-title">A background job either finishes, or waits where you can see it</title><desc id="job-lifecycle-dark-desc">Background job states: enqueue creates a queued job; a worker claims it with a conditional update that exactly one worker wins and runs it under a lease; success marks it done; a failure re-queues it with exponential backoff and jitter until jobs_max_attempts, then marks it dead; a lease that expires because the worker stopped re-queues it; an administrator can retry a dead job.</desc><defs>
      <style>#job-lifecycle-dark-root { font-family: 'Geist', system-ui, sans-serif; color: #f5f5f5; }
      #job-lifecycle-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #job-lifecycle-dark-root .diagram-container { overflow-x: visible; }</style>
<marker id="job-lifecycle-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
<marker id="job-lifecycle-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
<marker id="job-lifecycle-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
<marker id="job-lifecycle-dark-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#bfc0c0" stroke-width="1.2"/></marker>
</defs><rect width="100%" height="100%" fill="#2d3142"/><path d="M 62,224 H 96" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#job-lifecycle-dark-arrow)"/><path d="M 288,208 H 384" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#job-lifecycle-dark-arrow)"/><path d="M 384,248 H 290" fill="none" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#job-lifecycle-dark-arrow)"/><path d="M 608,192 H 752 Q 760,192 760,184 V 138" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#job-lifecycle-dark-arrow)"/><path d="M 608,264 H 752 Q 760,264 760,272 V 334" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#job-lifecycle-dark-arrow-accent)"/><path d="M 496,296 V 432 Q 496,440 488,440 H 200 Q 192,440 192,432 V 298" fill="none" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#job-lifecycle-dark-arrow)"/><path d="M 884,376 H 900 Q 908,376 908,368 V 56 Q 908,48 900,48 H 200 Q 192,48 192,56 V 158" fill="none" stroke="#739fdf" stroke-width="1.2" marker-end="url(#job-lifecycle-dark-arrow-link)"/><rect x="300" y="190" width="72" height="12" rx="2" fill="#2d3142"/><text x="336" y="199" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CLAIM · WIN</text><rect x="316" y="254" width="40" height="12" rx="2" fill="#2d3142"/><text x="336" y="263" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RETRY</text><rect x="768" y="154" width="52" height="12" rx="2" fill="#2d3142"/><text x="794" y="163" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SUCCESS</text><rect x="768" y="294" width="76" height="12" rx="2" fill="#2d3142"/><text x="806" y="303" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MAX ATTEMPTS</text><rect x="302" y="446" width="84" height="12" rx="2" fill="#2d3142"/><text x="344" y="455" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LEASE EXPIRED</text><rect x="488" y="30" width="72" height="12" rx="2" fill="#2d3142"/><text x="524" y="39" fill="#739fdf" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ADMIN RETRY</text><circle cx="56" cy="224" r="6" fill="#f5f5f5"/><rect x="96" y="160" width="192" height="136" rx="8" fill="#2d3142"/><rect x="96" y="160" width="192" height="136" rx="8" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="112" y="186" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Queued</text><text x="112" y="206" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">run_at &lt;= now</text><text x="112" y="221" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">backoff with jitter</text><text x="112" y="236" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">idempotency_key</text><rect x="384" y="160" width="224" height="136" rx="8" fill="#2d3142"/><rect x="384" y="160" width="224" height="136" rx="8" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><text x="400" y="186" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Running</text><text x="400" y="206" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">one worker holds it</text><text x="400" y="221" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">lease = 2 x timeout</text><text x="400" y="236" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">handler must be</text><text x="400" y="251" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">idempotent</text><rect x="708" y="72" width="176" height="64" rx="8" fill="#2d3142"/><rect x="708" y="72" width="176" height="64" rx="8" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/><text x="724" y="98" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Done</text><text x="724" y="118" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">kept 14 days</text><rect x="708" y="336" width="176" height="80" rx="8" fill="#2d3142"/><rect x="708" y="336" width="176" height="80" rx="8" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1"/><text x="724" y="362" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Dead</text><text x="724" y="382" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">last_error kept</text><text x="724" y="397" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">/admin/jobs?status=dead</text><text x="96" y="476" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">Workers run inside the API (jobs_run_in_api) or alone (python -m app.jobs); claiming works on any backend.</text><line x1="32" y1="488" x2="928" y2="488" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="0.8"/><text x="32" y="506" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><line x1="112" y1="503" x2="140" y2="503" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#job-lifecycle-dark-arrow)"/><text x="148" y="506" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">transition</text><line x1="232" y1="503" x2="260" y2="503" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#job-lifecycle-dark-arrow)"/><text x="268" y="506" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">back to the queue</text><line x1="392" y1="503" x2="420" y2="503" stroke="#f08a59" stroke-width="1.4" marker-end="url(#job-lifecycle-dark-arrow-accent)"/><text x="428" y="506" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">gives up</text><line x1="504" y1="503" x2="532" y2="503" stroke="#739fdf" stroke-width="1.2" marker-end="url(#job-lifecycle-dark-arrow-link)"/><text x="540" y="506" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">administrator</text></svg>
