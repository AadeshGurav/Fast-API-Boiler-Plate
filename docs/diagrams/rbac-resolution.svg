<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 432" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rbac-resolution-title rbac-resolution-desc" id="rbac-resolution-root"><title id="rbac-resolution-title">How a request earns its permission</title><desc id="rbac-resolution-desc">RBAC resolution: role definitions from config.toml, the user&#x27;s roles and groups, and active temporary grants are merged into one permission set, cached per user, and checked against the resource:action the middleware derives from the request method and path.</desc><defs>
      <style>#rbac-resolution-root { font-family: 'Geist', system-ui, sans-serif; color: #2d3142; }
      #rbac-resolution-root .diagram-container { width: 100%; overflow-x: auto; }
      #rbac-resolution-root .diagram-container { overflow-x: visible; }</style>
<marker id="rbac-resolution-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="rbac-resolution-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="rbac-resolution-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
<marker id="rbac-resolution-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
