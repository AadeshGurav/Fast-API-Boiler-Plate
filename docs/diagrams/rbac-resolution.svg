ts</text><rect x="32" y="176" width="176" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="176" width="176" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/><rect x="40" y="182" width="20" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/><text x="50" y="191" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text><text x="120" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">User record</text><text x="120" y="226" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">roles · groups</text><rect x="32" y="280" width="176" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="280" width="176" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/><rect x="40" y="286" width="20" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/><text x="50" y="295" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text><text x="120" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Temporary grants</text><text x="120" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">start · end · revoked</text><rect x="272" y="176" width="176" height="64" rx="6" fill="#f5f5f5"/><rect x="272" y="176" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="280" y="182" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="294" y="191" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RBAC</text><text x="360" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Resolve permissions</text><text x="360" y="226" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">union · cycles cut</text><rect x="512" y="176" width="176" height="64" rx="6" fill="#f5f5f5"/><rect x="512" y="176" width="176" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/><rect x="520" y="182" width="20" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/><text x="530" y="191" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">KV</text><text x="600" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Cached set</text><text x="600" y="226" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">TTL 300 s · dropped on change</text><rect x="752" y="176" width="176" height="64" rx="6" fill="#f5f5f5"/><rect x="752" y="176" width="176" height="64" rx="6" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/><rect x="760" y="182" width="36" height="12" rx="2" fill="none" stroke="#bf4520" stroke-opacity="0.50" stroke-width="0.8"/><text x="778" y="191" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CHECK</text><text x="840" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Check permission</text><text x="840" y="226" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">* · files:* · files:delete</text><rect x="752" y="40" width="176" height="64" rx="6" fill="#f5f5f5"/><rect x="752" y="40" width="176" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#5a6580" stroke-width="1"/><rect x="760" y="46" width="28" height="12" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.40" stroke-width="0.8"/><text x="774" y="55" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text><text x="840" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">DELETE /api/v1/files/7</text><text x="840" y="90" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">method + first segment</text><rect x="752" y="280" width="176" height="64" rx="6" fill="#f5f5f5"/><rect x="752" y="280" width="176" height="64" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="4,3"/><rect x="760" y="286" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/><text x="780" y="295" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RESULT</text><text x="840" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Allowed → route runs</text><text x="840" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">otherwise 403 problem</text><line x1="32" y1="384" x2="928" y2="384" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/><text x="32" y="402" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><line x1="112" y1="399" x2="140" y2="399" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rbac-resolution-arrow)"/><text x="148" y="402" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">feeds</text><line x1="204" y1="399" x2="232" y2="399" stroke="#bf4520" stroke-width="1.4" marker-end="url(#rbac-resolution-arrow-accent)"/><text x="240" y="402" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">decision path</text><line x1="344" y1="399" x2="372" y2="399" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#rbac-resolution-arrow-link)"/><text x="380" y="402" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">from the request</text><rect x="500" y="392" width="28" height="14" rx="3" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/><text x="536" y="402" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the check</text><rect x="616" y="392" width="28" height="14" rx="3" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/><text x="652" y="402" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">stored state</text></svg>
