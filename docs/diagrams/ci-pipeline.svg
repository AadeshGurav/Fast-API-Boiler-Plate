<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ci-pipeline-title ci-pipeline-desc" id="ci-pipeline-root"><title id="ci-pipeline-title">Every pull request clears four independent gates</title><desc id="ci-pipeline-desc">Continuous integration: each push or pull request runs four jobs in parallel: lint and tests on Python 3.11 and 3.13 with coverage and API fuzzing, after checking that uv.lock and its exports are current; the backend contract suite against real MongoDB, PostgreSQL and Redis; pip-audit over the whole locked dependency tree; and a Docker image build scanned by Trivy. All four must pass to merge; after a merge to develop a separate workflow refreshes the code graph.</desc><defs>
      <style>#ci-pipeline-root { font-family: 'Geist', system-ui, sans-serif; color: #2d3142; }
      #ci-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #ci-pipeline-root .diagram-container { overflow-x: visible; }</style>
<marker id="ci-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="ci-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="ci-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
<marker id="ci-pipeline-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
