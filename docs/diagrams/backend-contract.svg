<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="backend-contract-title backend-contract-desc" id="backend-contract-root"><title id="backend-contract-title">One contract suite decides which engines may run the app</title><desc id="backend-contract-desc">Backend contract: the same tests in tests/contract (database rules, cache rules and a whole-application smoke test) run against the in-memory stand-ins on every make test, against real MongoDB 8, PostgreSQL 17 and Redis 7 in CI, and against your own backend class when you name it.</desc><defs>
