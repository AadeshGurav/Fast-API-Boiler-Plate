d75" stroke-opacity="0.50" stroke-width="0.8"/><text x="74" y="239" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text><text x="120" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">FakeDatabase</text><text x="120" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">in-memory</text><rect x="200" y="224" width="128" height="72" rx="6" fill="#f5f5f5"/><rect x="200" y="224" width="128" height="72" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/><rect x="208" y="230" width="20" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/><text x="218" y="239" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text><text x="264" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">MongoDB 8</text><text x="264" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">default</text><rect x="344" y="224" width="128" height="72" rx="6" fill="#f5f5f5"/><rect x="344" y="224" width="128" height="72" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/><rect x="352" y="230" width="20" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/><text x="362" y="239" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text><text x="408" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PostgreSQL 17</text><text x="408" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">JSONB tables</text><rect x="488" y="224" width="128" height="72" rx="6" fill="#f5f5f5"/><rect x="488" y="224" width="128" height="72" rx="6" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="4,3"/><rect x="496" y="230" width="20" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/><text x="506" y="239" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DB</text><text x="552" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Your backend</text><text x="552" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">module:Class</text><rect x="664" y="224" width="112" height="72" rx="6" fill="#f5f5f5"/><rect x="664" y="224" width="112" height="72" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/><rect x="672" y="230" width="20" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/><text x="682" y="239" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">KV</text><text x="720" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">MemoryCache</text><text x="720" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one process</text><rect x="792" y="224" width="112" height="72" rx="6" fill="#f5f5f5"/><rect x="792" y="224" width="112" height="72" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/><rect x="800" y="230" width="20" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/><text x="810" y="239" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">KV</text><text x="848" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Redis 7</text><text x="848" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">default</text><text x="48" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">CONTRACT_DATABASES=fake,mongodb,postgres,package.module:Class  CONTRACT_CACHES=memory,redis</text><text x="48" y="372" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">A backend is finished when the suite is green against it: no application code changes.</text><line x1="32" y1="400" x2="928" y2="400" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/><text x="32" y="418" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><line x1="112" y1="415" x2="140" y2="415" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#backend-contract-arrow)"/><text x="148" y="418" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">runs against</text><line x1="244" y1="415" x2="272" y2="415" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#backend-contract-arrow)"/><text x="280" y="418" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">when you name it</text><rect x="400" y="408" width="28" height="14" rx="3" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/><text x="436" y="418" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the definition</text><rect x="544" y="408" width="28" height="14" rx="3" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/><text x="580" y="418" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">built in</text><rect x="656" y="408" width="28" height="14" rx="3" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="4,3"/><text x="692" y="418" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">bring your own</text></svg>
