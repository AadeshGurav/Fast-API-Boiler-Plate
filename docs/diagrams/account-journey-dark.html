nospace" text-anchor="middle" letter-spacing="0.14em">STAGE 4</text><text x="868" y="60" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Locked out</text><text x="868" y="296" fill="#f5f5f5" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Five wrong tries lock</text><text x="868" y="313" fill="#f5f5f5" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">the account for 15 min</text><text x="868" y="382" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">same 401 as a typo</text><text x="868" y="396" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">reset-password-request</text><text x="868" y="446" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">say &#x27;try again later or</text><text x="868" y="460" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">reset&#x27; without confirming</text><text x="1092" y="40" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">STAGE 5</text><text x="1092" y="60" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Recover</text><text x="1092" y="296" fill="#f5f5f5" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Follows the email link,</text><text x="1092" y="313" fill="#f5f5f5" font-size="12" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">sets a new password</text><text x="1092" y="382" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">reset-password-confirm</text><text x="1092" y="396" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">all sessions signed out</text><text x="1092" y="446" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">confirm success and that</text><text x="1092" y="460" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">other devices signed out</text><rect x="768" y="330" width="96" height="16" rx="2" fill="rgba(240,138,89,0.05)" stroke="rgba(240,138,89,0.50)" stroke-width="1" stroke-dasharray="3,3"/><text x="816" y="341" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO LOCK MESSAGE</text><rect x="872" y="330" width="96" height="16" rx="2" fill="rgba(240,138,89,0.05)" stroke="rgba(240,138,89,0.50)" stroke-width="1" stroke-dasharray="3,3"/><text x="920" y="341" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WAITS FOR EMAIL</text><line x1="32" y1="520" x2="1200" y2="520" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/><text x="32" y="538" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><line x1="112" y1="535" x2="140" y2="535" stroke="#bfc0c0" stroke-width="1.5"/><circle cx="126" cy="535" r="4" fill="#bfc0c0"/><text x="148" y="538" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">how it feels</text><line x1="272" y1="535" x2="300" y2="535" stroke="#f08a59" stroke-width="1.8"/><circle cx="286" cy="535" r="4" fill="#f08a59"/><text x="308" y="538" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the low point</text><rect x="440" y="528" width="28" height="14" rx="2" fill="rgba(240,138,89,0.05)" stroke="rgba(240,138,89,0.50)" stroke-dasharray="3,3"/><text x="476" y="538" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">friction to design for</text></svg>
