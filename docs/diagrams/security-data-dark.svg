ist Mono', ui-monospace, monospace"># id</text><text x="44" y="98" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">→ user_id</text><text x="44" y="112" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">token_hash (SHA-256)</text><text x="44" y="126" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">prefix · name · scopes[]</text><text x="44" y="140" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">expires_at TTL · last_used_at</text><rect x="368" y="128" width="224" height="96" rx="6" fill="#2d3142"/><rect x="368" y="128" width="224" height="96" rx="6" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1"/><rect x="376" y="136" width="40" height="12" rx="2" fill="none" stroke="#f08a59" stroke-opacity="0.5" stroke-width="0.8"/><text x="396" y="145" fill="#f08a59" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text><text x="424" y="147" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">users</text><line x1="368" y1="156" x2="592" y2="156" stroke="#f5f5f5" stroke-opacity="0.12" stroke-width="1"/><text x="380" y="172" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"># id</text><text x="380" y="186" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">username · email</text><text x="380" y="200" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">roles[] · groups[]</text><text x="380" y="214" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">status · locked_until</text><rect x="704" y="40" width="224" height="108" rx="6" fill="#2d3142"/><rect x="704" y="40" width="224" height="108" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><rect x="712" y="48" width="40" height="12" rx="2" fill="none" stroke="#f5f5f5" stroke-opacity="0.5" stroke-width="0.8"/><text x="732" y="57" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text><text x="760" y="59" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">mfa_totp</text><line x1="704" y1="68" x2="928" y2="68" stroke="#f5f5f5" stroke-opacity="0.12" stroke-width="1"/><text x="716" y="84" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">→ user_id (unique)</text><text x="716" y="98" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">secret (Fernet-encrypted)</text><text x="716" y="112" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">confirmed_at · last_step</text><text x="716" y="126" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">recovery_codes[] (hashed)</text><text x="716" y="140" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">codes_version</text><rect x="368" y="312" width="224" height="108" rx="6" fill="#2d3142"/><rect x="368" y="312" width="224" height="108" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/><rect x="376" y="320" width="40" height="12" rx="2" fill="none" stroke="#f5f5f5" stroke-opacity="0.5" stroke-width="0.8"/><text x="396" y="329" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text><text x="424" y="331" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">audit_events</text><line x1="368" y1="340" x2="592" y2="340" stroke="#f5f5f5" stroke-opacity="0.12" stroke-width="1"/><text x="380" y="356" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"># id · at TTL</text><text x="380" y="370" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">→ actor_id · target_id</text><text x="380" y="384" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">action · target_type</text><text x="380" y="398" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">ip · user_agent · request_id</text><text x="380" y="412" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">details (no secrets)</text><text x="32" y="464" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">Tokens and recovery codes: hashes only. Two-factor secret: encrypted with mfa_encryption_key. All three are read from the database, never the cache.</text><line x1="32" y1="472" x2="928" y2="472" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="0.8"/><text x="32" y="490" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><rect x="112" y="480" width="28" height="14" rx="3" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1"/><text x="148" y="490" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">aggregate root</text></svg>
