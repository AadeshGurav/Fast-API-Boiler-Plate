<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="security-data-dark-title security-data-dark-desc" id="security-data-dark-root"><title id="security-data-dark-title">Security records hang off the user; no secret is stored readable</title><desc id="security-data-dark-desc">Security data model: a user owns API tokens (stored as SHA-256 hashes with scopes and expiry), at most one two-factor record (an encrypted authenticator secret, the last accepted time step and hashed recovery codes), and is the actor or target of audit events (append-only, with IP address, user agent and request id, expiring after audit_retention_days).</desc><defs>
      <style>#security-data-dark-root { font-family: 'Geist', system-ui, sans-serif; color: #f5f5f5; }
      #security-data-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #security-data-dark-root .diagram-container { overflow-x: visible; }</style>
<marker id="security-data-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
<marker id="security-data-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
<marker id="security-data-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
<marker id="security-data-dark-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#bfc0c0" stroke-width="1.2"/></marker>
