E</text><path d="M 600,272 H 122" fill="none" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#oidc-sign-in-dark-arrow)"/><rect x="322" y="254" width="76" height="12" rx="2" fill="#2d3142"/><text x="360" y="263" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CODE + STATE</text><path d="M 120,328 H 358" fill="none" stroke="#739fdf" stroke-width="1.2" marker-end="url(#oidc-sign-in-dark-arrow-link)"/><rect x="198" y="310" width="84" height="12" rx="2" fill="#2d3142"/><text x="240" y="319" fill="#739fdf" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GET /CALLBACK</text><path d="M 360,360 H 598" fill="none" stroke="#739fdf" stroke-width="1.2" marker-end="url(#oidc-sign-in-dark-arrow-link)"/><rect x="434" y="342" width="92" height="12" rx="2" fill="#2d3142"/><text x="480" y="351" fill="#739fdf" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CODE + VERIFIER</text><path d="M 600,392 H 362" fill="none" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#oidc-sign-in-dark-arrow)"/><rect x="452" y="374" width="56" height="12" rx="2" fill="#2d3142"/><text x="480" y="383" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ID TOKEN</text><path d="M 360,424 H 598" fill="none" stroke="#739fdf" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#oidc-sign-in-dark-arrow-link)"/><rect x="438" y="406" width="84" height="12" rx="2" fill="#2d3142"/><text x="480" y="415" fill="#739fdf" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">JWKS (CACHED)</text><path d="M 360,488 H 838" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#oidc-sign-in-dark-arrow)"/><rect x="562" y="470" width="76" height="12" rx="2" fill="#2d3142"/><text x="600" y="479" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LINK ACCOUNT</text><path d="M 360,520 H 122" fill="none" stroke="#f08a59" stroke-width="1.4" marker-end="url(#oidc-sign-in-dark-arrow-accent)"/><rect x="198" y="502" width="84" height="12" rx="2" fill="#2d3142"/><text x="240" y="511" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">200 · COOKIES</text><text x="136" y="204" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">cookie: state · PKCE verifier · nonce (HttpOnly, 10 min)</text><text x="376" y="452" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">verify: signature · iss · aud · exp · nonce</text><rect x="48" y="24" width="144" height="48" rx="6" fill="#2d3142"/><rect x="48" y="24" width="144" height="48" rx="6" fill="#bfc0c0" fill-opacity="0.10" stroke="#949eb2" stroke-width="1"/><rect x="56" y="30" width="24" height="12" rx="2" fill="none" stroke="#949eb2" stroke-opacity="0.40" stroke-width="0.8"/><text x="68" y="39" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APP</text><text x="120" y="52" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Browser</text><text x="120" y="66" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">your front end</text><rect x="288" y="24" width="144" height="48" rx="6" fill="#2d3142"/><rect x="288" y="24" width="144" height="48" rx="6" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1"/><rect x="296" y="30" width="24" height="12" rx="2" fill="none" stroke="#f08a59" stroke-opacity="0.50" stroke-width="0.8