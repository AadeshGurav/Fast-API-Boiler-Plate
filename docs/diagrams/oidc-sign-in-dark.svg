<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="oidc-sign-in-dark-title oidc-sign-in-dark-desc" id="oidc-sign-in-dark-root"><title id="oidc-sign-in-dark-title">Sign in with any identity provider, and trust only what is signed</title><desc id="oidc-sign-in-dark-desc">OpenID Connect sign-in: the API sends the browser to the provider with a state, a PKCE challenge and a nonce, keeping their secrets in an HttpOnly cookie; the provider returns a code; the API checks the state, exchanges the code with the PKCE verifier, verifies the ID token&#x27;s signature against the provider&#x27;s keys, its issuer, audience, expiry and nonce, then links or creates the account and opens a session.</desc><defs>
      <style>#oidc-sign-in-dark-root { font-family: 'Geist', system-ui, sans-serif; color: #f5f5f5; }
      #oidc-sign-in-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #oidc-sign-in-dark-root .diagram-container { overflow-x: visible; }</style>
<marker id="oidc-sign-in-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
<marker id="oidc-sign-in-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
<marker id="oidc-sign-in-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
<marker id="oidc-sign-in-dark-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#bfc0c0" stroke-width="1.2"/></marker>
