="1.2" marker-end="url(#request-pipeline-arrow)"/><rect x="476" y="426" width="108" height="12" rx="2" fill="#f5f5f5"/><text x="530" y="435" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REPLAY · 409 · 422</text><path d="M 420,524 H 640" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#request-pipeline-arrow)"/><rect x="500" y="506" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="530" y="515" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">401 · 403</text><rect x="220" y="16" width="160" height="48" rx="20" fill="#f5f5f5"/><rect x="220" y="16" width="160" height="48" rx="20" fill="#4f5d75" fill-opacity="0.10" stroke="#5a6580" stroke-width="1"/><text x="300" y="38" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Request</text><text x="300" y="52" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">HTTP · ASGI scope</text><rect x="180" y="96" width="240" height="56" rx="6" fill="#f5f5f5"/><rect x="180" y="96" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="188" y="102" width="20" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="198" y="111" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">01</text><text x="300" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Identify</text><text x="300" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">request id · security headers</text><rect x="180" y="176" width="240" height="56" rx="6" fill="#f5f5f5"/><rect x="180" y="176" width="240" height=