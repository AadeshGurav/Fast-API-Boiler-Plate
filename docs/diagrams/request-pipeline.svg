Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><line x1="112" y1="675" x2="140" y2="675" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#request-pipeline-arrow)"/><text x="148" y="678" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">request flow</text><line x1="244" y1="675" x2="272" y2="675" stroke="#bf4520" stroke-width="1.4" marker-end="url(#request-pipeline-arrow-accent)"/><text x="280" y="678" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">accepted</text><rect x="356" y="668" width="28" height="14" rx="3" fill="#4f5d75" fill-opacity="0.10" stroke="#5a6580" stroke-width="1"/><text x="392" y="678" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">start</text><rect x="448" y="668" width="28" height="14" rx="3" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/><text x="484" y="678" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">your code</text><rect x="564" y="668" width="28" height="14" rx="3" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/><text x="600" y="678" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">early answer</text></svg>
