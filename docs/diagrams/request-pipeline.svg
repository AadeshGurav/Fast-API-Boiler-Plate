<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="request-pipeline-title request-pipeline-desc" id="request-pipeline-root"><title id="request-pipeline-title">Every request passes six gates before your route runs</title><desc id="request-pipeline-desc">Request pipeline: a request is tagged with an id and security headers, then its body, origin and CORS are checked, errors are caught, load is shed, idempotent retries are replayed, and the caller is authenticated and authorized; any gate can answer early with a problem+json response.</desc><defs>
      <style>#request-pipeline-root { font-family: 'Geist', system-ui, sans-serif; color: #2d3142; }
      #request-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #request-pipeline-root .diagram-container { overflow-x: visible; }</style>
