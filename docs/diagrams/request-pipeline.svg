xt-anchor="middle">Shed load</text><text x="300" y="382" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">timeout · concurrency · rate limit</text><rect x="180" y="416" width="240" height="56" rx="6" fill="#f5f5f5"/><rect x="180" y="416" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="188" y="422" width="20" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="198" y="431" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">05</text><text x="300" y="448" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Replay retries</text><text x="300" y="462" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Idempotency-Key</text><rect x="180" y="496" width="240" height="56" rx="6" fill="#f5f5f5"/><rect x="180" y="496" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="188" y="502" width="20" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/><text x="198" y="511" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">06</text><text x="300" y="528" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Authenticate · authorize</text><text x="300" y="542" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">session cookies · RBAC</text><rect x="200" y="576" width="200" height="56" rx="20" fill="#f5f5f5"/><rect x="200" y="576" width="200" height="56" rx="20" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/><rect x="208" y="582" width="36" height="12" rx="2" fill="none" stroke="#bf4520