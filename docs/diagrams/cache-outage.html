<body>
<div class="frame">
<p class="eyebrow">State machine · for operators and SREs</p>
<h1>Losing Redis slows the service down, it does not take it down</h1>
<div class="diagram-container">
<svg viewBox="0 0 960 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cache-outage-title cache-outage-desc"><title id="cache-outage-title">Losing Redis slows the service down, it does not take it down</title><desc id="cache-outage-desc">Cache circuit states: while healthy the cache is used normally; any cache error opens the circuit for cache_failure_cooldown_seconds, during which reads fall through to the database, writes are skipped, rate limiting fails open and idempotent requests answer 503; after the cool-down one call tries the cache again and either closes or reopens the circuit.</desc><defs>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>

itten</text><text x="112" y="202" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">sessions · permissions</text><text x="112" y="218" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">rate counters · claims</text><rect x="384" y="136" width="224" height="128" rx="8" fill="#f5f5f5"/><rect x="384" y="136" width="224" height="128" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="400" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Cooling down</text><text x="400" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">reads → database answers</text><text x="400" y="202" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">writes skipped, TTL cleans</text><text x="400" y="218" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">rate limit fails open</text><text x="400" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">idempotency → 503</text><rect x="704" y="136" width="192" height="128" rx="8" fill="#f5f5f5"/><rect x="704" y="136" width="192" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="720" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Trial call</text><text x="720" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">next request tries Redis</text><text x="720" y="202" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">1 s timeout, 1 retry</text><line x1="32" y1="416" x2="928" y2="416" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="434" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><line x1="112" y1="431" x2="140" y2="431" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="148" y="434" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">transition</text><line x1="232" y1="431" x2="260" y2="431" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/><text x="268" y="434" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">outage continues</text><rect x="388" y="424" width="28" height="14" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="424" y="434" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">degraded but serving</text></svg>
