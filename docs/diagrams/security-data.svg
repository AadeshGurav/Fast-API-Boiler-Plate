<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="security-data-title security-data-desc" id="security-data-root"><title id="security-data-title">Security records hang off the user; no secret is stored readable</title><desc id="security-data-desc">Security data model: a user owns passkeys (public keys only, with a signature counter), API tokens (stored as SHA-256 hashes with scopes and expiry), at most one two-factor record (an encrypted authenticator secret, the last accepted time step and hashed recovery codes), and is the actor or target of audit events (append-only, with IP address, user agent and request id, expiring after audit_retention_days).</desc><defs>
      <style>#security-data-root { font-family: 'Geist', system-ui, sans-serif; color: #2d3142; }
      #security-data-root .diagram-container { width: 100%; overflow-x: auto; }
      #security-data-root .diagram-container { overflow-x: visible; }</style>
