<svg viewBox="0 0 960 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deployment-dark-title deployment-dark-desc" id="deployment-dark-root"><title id="deployment-dark-title">Where it runs: one image, three backing services</title><desc id="deployment-dark-desc">Deployment view: clients reach a reverse proxy over HTTPS; the proxy forwards to the API container (python 3.11-slim image, any number of replicas once Redis and S3 are used); the API talks to MongoDB 8.0, Redis 7.2 and optional S3-compatible storage, with database ports bound to loopback.</desc><defs>
