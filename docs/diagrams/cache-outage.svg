<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cache-outage-title cache-outage-desc" id="cache-outage-root"><title id="cache-outage-title">Losing Redis slows the service down, it does not take it down</title><desc id="cache-outage-desc">Cache circuit states: while healthy the cache is used normally; any cache error opens the circuit for cache_failure_cooldown_seconds, during which reads fall through to the database, writes are skipped, rate limiting fails open and idempotent requests answer 503; after the cool-down one call tries the cache again and either closes or reopens the circuit.</desc><defs>
      <style>#cache-outage-root { font-family: 'Geist', system-ui, sans-serif; color: #2d3142; }
      #cache-outage-root .diagram-container { width: 100%; overflow-x: auto; }
      #cache-outage-root .diagram-container { overflow-x: visible; }</style>
<marker id="cache-outage-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="cache-outage-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="cache-outage-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
<marker id="cache-outage-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
</defs><rect width="100%" height="100%" fill="#f5f5f5"/><path d="M 62,200 H 96" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cache-outage-arrow)"/><path d="M 288,184 H 384" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cache-outage-arrow)"/><path d="M 608,184 H 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cache-outage-arrow)"/><path d="M 704,216 H 608" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#cache-outage-arrow-accent)"/><path d="M 800,264 V 352 Q 800,360 792,360 H 200 Q 192,360 192,352 V 264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cache-outage-arrow)"/><rect x="306" y="166" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="336" y="175" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ANY ERROR</text><rect x="626" y="166" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="656" y="175" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">10 S PASS</text><rect x="636" y="222" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="656" y="231" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FAILS</text><rect x="468" y="366" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="496" y="375" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SUCCEEDS</text><circle cx="56" cy="200" r="6" fill="#2d3142"/><rect x="96" y="136" width="192" height="128" rx="8" fill="#f5f5f5"/><rect x="96" y="136" width="192" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="112" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Healthy</text><text x="112" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">cache read and written</text><text x="112" y="202" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">sessions · permissions</text><text x="112" y="218" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">rate counters · claims</text><rect x="384" y="136" width="224" height="128" rx="8" fill="#f5f5f5"/><rect x="384" y="136" width="224" height="128" rx="8" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/><text x="400" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Cooling down</text><text x="400" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">reads → database answers</text><text x="400" y="202" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">writes skipped, TTL cleans</text><text x="400" y="218" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">rate limit fails open</text><text x="400" y="234" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">idempotency → 503</text><rect x="704" y="136" width="192" height="128" rx="8" fill="#f5f5f5"/><rect x="704" y="136" width="192" height="128" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="720" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Trial call</text><text x="720" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">next request tries Redis</text><text x="720" y="202" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">1 s timeout, 1 retry</text><line x1="32" y1="416" x2="928" y2="416" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/><text x="32" y="434" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><line x1="112" y1="431" x2="140" y2="431" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cache-outage-arrow)"/><text x="148" y="434" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">transition</text><line x1="232" y1="431" x2="260" y2="431" stroke="#bf4520" stroke-width="1.4" marker-end="url(#cache-outage-arrow-accent)"/><text x="268" y="434" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">outage continues</text><rect x="388" y="424" width="28" height="14" rx="3" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/><text x="424" y="434" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">degraded but serving</text></svg>
