<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="api-token-check-title api-token-check-desc" id="api-token-check-root"><title id="api-token-check-title">An API token can never do more than its owner can right now</title><desc id="api-token-check-desc">API token check: a fabp_pat_ bearer token is looked up by its SHA-256 hash; an unknown or expired token, or one whose owner is no longer active, answers 401; the permission the route needs must be covered by the token&#x27;s scopes and also held by the owner today, otherwise 403; only then does the route run.</desc><defs>
      <style>#api-token-check-root { font-family: 'Geist', system-ui, sans-serif; color: #2d3142; }
      #api-token-check-root .diagram-container { width: 100%; overflow-x: auto; }
      #api-token-check-root .diagram-container { overflow-x: visible; }</style>
<marker id="api-token-check-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="api-token-check-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="api-token-check-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
<marker id="api-token-check-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
</defs><rect width="100%" height="100%" fill="#f5f5f5"/><path d="M 360,64 V 86" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#api-token-check-arrow)"/><path d="M 360,160 V 198" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#api-token-check-arrow)"/><path d="M 360,272 V 310" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#api-token-check-arrow)"/><path d="M 360,384 V 422" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#api-token-check-arrow)"/><path d="M 360,496 V 530" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#api-token-check-arrow-accent)"/><path d="M 456,124 H 638" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#api-token-check-arrow)"/><path d="M 456,236 H 638" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#api-token-check-arrow)"/><path d="M 456,348 H 638" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#api-token-check-arrow)"/><path d="M 456,460 H 638" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#api-token-check-arrow)"/><rect x="368" y="174" width="28" height="12" rx="2" fill="#f5f5f5"/><text x="382" y="183" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="368" y="286" width="28" height="12" rx="2" fill="#f5f5f5"/><text x="382" y="295" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="368" y="398" width="28" height="12" rx="2" fill="#f5f5f5"/><text x="382" y="407" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="368" y="508" width="28" height="12" rx="2" fill="#f5f5f5"/><text x="382" y="517" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="536" y="106" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="548" y="115" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="536" y="218" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="548" y="227" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="536" y="330" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="548" y="339" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="536" y="442" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="548" y="451" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="240" y="24" width="240" height="40" rx="20" fill="#f5f5f5"/><rect x="240" y="24" width="240" height="40" rx="20" fill="#4f5d75" fill-opacity="0.10" stroke="#5a6580" stroke-width="1"/><text x="360" y="42" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Bearer fabp_pat_…</text><text x="360" y="56" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">looked up by SHA-256 hash</text><polygon points="360,88 456,124 360,160 264,124" fill="#f5f5f5"/><polygon points="360,88 456,124 360,160 264,124" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="360" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Known, unexpired?</text><polygon points="360,200 456,236 360,272 264,236" fill="#f5f5f5"/><polygon points="360,200 456,236 360,272 264,236" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="360" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Owner active?</text><polygon points="360,312 456,348 360,384 264,348" fill="#f5f5f5"/><polygon points="360,312 456,348 360,384 264,348" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="360" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Scopes cover it?</text><polygon points="360,424 456,460 360,496 264,460" fill="#f5f5f5"/><polygon points="360,424 456,460 360,496 264,460" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="360" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Owner holds it?</text><rect x="260" y="532" width="200" height="48" rx="20" fill="#f5f5f5"/><rect x="260" y="532" width="200" height="48" rx="20" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/><text x="360" y="554" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Route runs</text><text x="360" y="568" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no session · no refresh</text><rect x="640" y="100" width="248" height="160" rx="20" fill="#f5f5f5"/><rect x="640" y="100" width="248" height="160" rx="20" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/><text x="764" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">401 problem</text><text x="764" y="192" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">revoked · expired · suspended</text><rect x="640" y="324" width="248" height="160" rx="20" fill="#f5f5f5"/><rect x="640" y="324" width="248" height="160" rx="20" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/><text x="764" y="402" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">403 problem</text><text x="764" y="416" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">scopes ∩ current permissions</text><text x="640" y="520" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">A token cannot create or revoke tokens;</text><text x="640" y="534" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">removing a role narrows every token at once.</text><line x1="32" y1="624" x2="928" y2="624" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/><text x="32" y="642" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><line x1="112" y1="639" x2="140" y2="639" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#api-token-check-arrow)"/><text x="148" y="642" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">check</text><line x1="204" y1="639" x2="232" y2="639" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#api-token-check-arrow)"/><text x="240" y="642" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">refused</text><line x1="308" y1="639" x2="336" y2="639" stroke="#bf4520" stroke-width="1.4" marker-end="url(#api-token-check-arrow-accent)"/><text x="344" y="642" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">allowed</text><rect x="412" y="632" width="28" height="14" rx="3" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/><text x="448" y="642" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">success</text><rect x="516" y="632" width="28" height="14" rx="3" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/><text x="552" y="642" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">early answer</text></svg>
