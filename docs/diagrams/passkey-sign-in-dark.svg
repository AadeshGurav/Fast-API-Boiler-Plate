<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 616" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="passkey-sign-in-dark-title passkey-sign-in-dark-desc" id="passkey-sign-in-dark-root"><title id="passkey-sign-in-dark-title">A passkey signs one challenge, for one site, once</title><desc id="passkey-sign-in-dark-desc">Passkey sign-in: the client asks for options and gets a single-use challenge; the browser asks the device&#x27;s authenticator, which checks the user (biometric or PIN) and signs the challenge with a key that only works on this site&#x27;s origin; the API verifies the signature, origin, user verification and signature counter, deletes the challenge, and opens a session without a password or code.</desc><defs>
      <style>#passkey-sign-in-dark-root { font-family: 'Geist', system-ui, sans-serif; color: #f5f5f5; }
      #passkey-sign-in-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #passkey-sign-in-dark-root .diagram-container { overflow-x: visible; }</style>
<marker id="passkey-sign-in-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker>
<marker id="passkey-sign-in-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker>
<marker id="passkey-sign-in-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#739fdf"/></marker>
<marker id="passkey-sign-in-dark-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#bfc0c0" stroke-width="1.2"/></marker>
