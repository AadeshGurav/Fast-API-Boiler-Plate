 grows</text><text x="96" y="296" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">Face ID / Touch ID / PIN; the key never leaves the device</text><rect x="48" y="24" width="144" height="48" rx="6" fill="#2d3142"/><rect x="48" y="24" width="144" height="48" rx="6" fill="#f08a59" fill-opacity="0.05" stroke="#f08a59" stroke-opacity="0.50" stroke-width="1" stroke-dasharray="4,4"/><rect x="56" y="30" width="24" height="12" rx="2" fill="none" stroke="#f08a59" stroke-opacity="0.40" stroke-width="0.8"/><text x="68" y="39" fill="#f08a59" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DEV</text><text x="120" y="52" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Authenticator</text><text x="120" y="66" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">phone · laptop · key</text><rect x="288" y="24" width="144" height="48" rx="6" fill="#2d3142"/><rect x="288" y="24" width="144" height="48" rx="6" fill="#bfc0c0" fill-opacity="0.10" stroke="#949eb2" stroke-width="1"/><rect x="296" y="30" width="24" height="12" rx="2" fill="none" stroke="#949eb2" stroke-opacity="0.40" stroke-width="0.8"/><text x="308" y="39" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">APP</text><text x="360" y="52" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Client app</text><text x="360" y="66" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">navigator.credentials</text><rect x="528" y="24" width="144" height="48" rx="6" fill="#2d3142"/><rect x="528" y="24" width="144" height="48" rx="6" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1"/><rect x="536" y="30"