<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="code-layers-title code-layers-desc" id="code-layers-root"><title id="code-layers-title">Five layers, each calling only the one below</title><desc id="code-layers-desc">Code layers from top to bottom: HTTP routes, business services, the cache-aware data layer with per-collection ops, the backend services that pick and guard an engine, and the swappable engines for MongoDB, Redis or memory, and local disk or S3.</desc><defs>
      <style>#code-layers-root { font-family: 'Geist', system-ui, sans-serif; color: #2d3142; }
      #code-layers-root .diagram-container { width: 100%; overflow-x: auto; }
      #code-layers-root .diagram-container { overflow-x: visible; }</style>
<marker id="code-layers-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="code-layers-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
<marker id="code-layers-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
<marker id="code-layers-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>
</defs><rect width="100%" height="100%" fill="#f5f5f5"/><rect x="144" y="56" width="728" height="64" fill="#ececec"/><text x="164" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">L5</text><text x="232" y="86" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Routes</text><text x="232" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">app/api/routes/ · parse, call a service, shape the reply</text><text x="852" y="92" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">no business logic</text><rect x="144" y="120" width="728" height="64" fill="#f5f5f5"/><line x1="144" y1="120" x2="872" y2="120" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/><text x="164" y="156" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">L4</text><text x="232" y="150" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Services</text><text x="232" y="166" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">auth · rbac · file · oauth · password</text><text x="852" y="156" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">never touch Mongo or Redis</text><rect x="144" y="184" width="728" height="64" fill="#bf4520" fill-opacity="0.08"/><line x1="144" y1="184" x2="872" y2="184" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/><text x="164" y="220" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">L3</text><text x="232" y="214" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Data layer</text><text x="232" y="230" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">DataService + services/data/*_ops.py · cache keys</text><text x="852" y="220" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">where queries live</text><rect x="144" y="248" width="728" height="64" fill="#f5f5f5"/><line x1="144" y1="248" x2="872" y2="248" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/><text x="164" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">L2</text><text x="232" y="278" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Backend services</text><text x="232" y="294" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">DatabaseService · CacheService · create_storage</text><text x="852" y="284" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">pick, namespace, degrade</text><rect x="144" y="312" width="728" height="64" fill="#ececec"/><line x1="144" y1="312" x2="872" y2="312" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/><text x="164" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">L1</text><text x="232" y="342" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Engines</text><text x="232" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">MongoDB · Redis | memory · local | S3</text><text x="852" y="348" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">package.module:Class</text><rect x="144" y="56" width="728" height="320" fill="none" stroke="#4f5d75" stroke-width="1"/><rect x="144.5" y="184.5" width="727" height="63" fill="none" stroke="#bf4520" stroke-width="1.2"/><path d="M 96,64 V 368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#code-layers-arrow)"/><text x="84" y="68" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.14em">CALLS</text><text x="84" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.14em">ENGINE</text><text x="144" y="412" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Middleware wraps the top layer; build_services() wires all five once per app.</text><line x1="32" y1="428" x2="928" y2="428" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/><text x="32" y="446" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><rect x="112" y="436" width="28" height="14" rx="3" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/><text x="148" y="446" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">add your resource&#x27;s queries here</text></svg>
