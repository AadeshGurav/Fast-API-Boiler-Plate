<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 808" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="file-upload-title file-upload-desc" id="file-upload-root"><title id="file-upload-title">An upload, from first byte to new version</title><desc id="file-upload-desc">File upload flow: the type and name are validated, bytes stream to storage while being counted and hashed, size and quota are enforced, identical bytes return the caller&#x27;s existing file, otherwise thumbnails and sheet info are derived and a new version is recorded; rejections answer 400.</desc><defs>
      <style>#file-upload-root { font-family: 'Geist', system-ui, sans-serif; color: #2d3142; }
      #file-upload-root .diagram-container { width: 100%; overflow-x: auto; }
      #file-upload-root .diagram-container { overflow-x: visible; }</style>
