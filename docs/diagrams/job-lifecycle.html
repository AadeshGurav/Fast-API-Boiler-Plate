<p class="eyebrow">State machine · for developers and operators</p>
<h1>A background job either finishes, or waits where you can see it</h1>
<div class="diagram-container">
<svg viewBox="0 0 960 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="job-lifecycle-title job-lifecycle-desc"><title id="job-lifecycle-title">A background job either finishes, or waits where you can see it</title><desc id="job-lifecycle-desc">Background job states: enqueue creates a queued job; a worker claims it with a conditional update that exactly one worker wins and runs it under a lease; success marks it done; a failure re-queues it with exponential backoff and jitter until jobs_max_attempts, then marks it dead; a lease that expires because the worker stopped re-queues it; an administrator can retry a dead job.</desc><defs>

<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
<marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker>

5" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LEASE EXPIRED</text><rect x="488" y="30" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="524" y="39" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ADMIN RETRY</text><circle cx="56" cy="224" r="6" fill="#2d3142"/><rect x="96" y="160" width="192" height="136" rx="8" fill="#f5f5f5"/><rect x="96" y="160" width="192" height="136" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="112" y="186" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Queued</text><text x="112" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">run_at &lt;= now</text><text x="112" y="221" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">backoff with jitter</text><text x="112" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">idempotency_key</text><rect x="384" y="160" width="224" height="136" rx="8" fill="#f5f5f5"/><rect x="384" y="160" width="224" height="136" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="400" y="186" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Running</text><text x="400" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">one worker holds it</text><text x="400" y="221" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">lease = 2 x timeout</text><text x="400" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">handler must be</text><text x="400" y="251" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">idempotent</text><rect x="708" y="72" width="176" height="64" rx="8" fill="#f5f5f5"/><rect x="708" y="72" width="176" height="64" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/><text x="724" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Done</text><text x="724" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">kept 14 days</text><rect x="708" y="336" width="176" height="80" rx="8" fill="#f5f5f5"/><rect x="708" y="336" width="176" height="80" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="724" y="362" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Dead</text><text x="724" y="382" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">last_error kept</text><text x="724" y="397" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">/admin/jobs?status=dead</text><text x="96" y="476" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.04em">Workers run inside the API (jobs_run_in_api) or alone (python -m app.jobs); claiming works on any backend.</text><line x1="32" y1="488" x2="928" y2="488" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/><text x="32" y="506" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text><line x1="112" y1="503" x2="140" y2="503" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><text x="148" y="506" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">transition</text><line x1="232" y1="503" x2="260" y2="503" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/><text x="268" y="506" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">back to the queue</text><line x1="392" y1="503" x2="420" y2="503" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/><text x="428" y="506" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">gives up</text><line x1="504" y1="503" x2="532" y2="503" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/><text x="540" y="506" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">administrator</text></svg>
