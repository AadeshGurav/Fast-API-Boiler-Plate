[project]
name = "fastapi-boilerplate"
version = "1.0.0"  # keep in step with app_version in app/settings.py
description = "Production-ready, storage-agnostic FastAPI boilerplate (MongoDB and Redis built in, any database pluggable): JWT sessions, RBAC, file storage, rate limiting, RFC 9457 errors."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Aadesh Gurav"}]
keywords = [
    "fastapi", "boilerplate", "template", "starter", "fastapi-boilerplate", "fastapi-template",
    "mongodb", "redis", "jwt", "authentication", "rbac", "oauth2", "s3", "rate-limiting",
    "rest-api", "production-ready", "python", "database-agnostic", "clean-architecture",
    "postgresql", "ai-agents",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
# Direct dependencies, pinned; uv.lock pins everything they pull in, with hashes. The
# requirements*.txt files are exported from the lock (`make lock`) for pip users and Docker.
dependencies = [
    "fastapi==0.142.4",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
    "uvloop==0.23.0; sys_platform != 'win32'",
    "httptools==0.8.0",
    "python-multipart==0.0.32",  # form and file uploads
    "pydantic==2.13.5",
    "email-validator==2.3.0",  # pydantic EmailStr
    "httpx==0.28.1",  # outbound HTTP (OIDC, webhooks)
    "motor==3.7.1",
    "pymongo==4.18.2",
    "redis==8.1.0",
    "PyJWT==2.15.1",
    "cryptography==50.0.2",  # secrets at rest (two-factor, webhooks)
    "webauthn==3.0.1",  # passkeys
    "argon2-cffi==25.1.0",
    "aiofiles==25.1.0",
    "pillow==12.3.0",
    "openpyxl==3.1.5",
    "odfpy==1.4.1",  # ods spreadsheets
    "prometheus_client==0.26.0",
    "user-agents==2.2.0",
]

[project.optional-dependencies]
s3 = ["boto3==1.43.110"]
postgres = ["asyncpg==0.32.0"]
observability = [
    "sentry-sdk==2.71.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp==1.45.1",
    "opentelemetry-instrumentation==0.66b1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-httpx==0.66b1",
    "opentelemetry-instrumentation-pymongo==0.66b1",
    "opentelemetry-instrumentation-redis==0.66b1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
    "moto==5.2.3",  # fake S3
    "schemathesis==4.30.0",  # API fuzzing
]

[tool.uv]
package = false  # an application, not a library: nothing to build or install
required-version = ">=0.12"

[project.urls]
Homepage = "https://github.com/AadeshGurav/Fast-API-Boiler-Plate"
Documentation = "https://github.com/AadeshGurav/Fast-API-Boiler-Plate/blob/develop/docs/README.md"
Changelog = "https://github.com/AadeshGurav/Fast-API-Boiler-Plate/blob/develop/CHANGELOG.md"
Issues = "https://github.com/AadeshGurav/Fast-API-Boiler-Plate/issues"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["graphify-out"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "S", "ASYNC", "UP", "RUF", "PLE"]
ignore = [
    "B008",    # Depends(...) in argument defaults is how FastAPI works
    "E501",    # line length is the formatter's job
    "RUF012",  # mutable class attributes on pydantic/dataclass-style models
    "UP007",   # keep `X | Y` and Optional both acceptable
    "S101",    # asserts are fine in tests; app code does not rely on them
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "ASYNC"]
# SQL is assembled from identifiers checked by postgres_sql.identifier(); every value is a
# bound parameter ($n). tests/test_postgres_sql.py pins both rules.
"app/database/postgres.py" = ["S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
markers = ["fuzz: property-based API fuzzing (make fuzz); slow, so not in make test"]
addopts = "-m 'not fuzz'"
